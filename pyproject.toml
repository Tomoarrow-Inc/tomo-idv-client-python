[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomo-idv-client-python"
version = "1.2.0.0"
description = "Python client SDK for the Tomo Identity Verification API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Tomoarrow Inc", email = "dev@tomoarrow.com" }
]
keywords = ["tomo", "identity-verification", "idv", "openapi", "sdk"]
dependencies = [
  "cryptography>=42.0.0",
  "pydantic>=2.11",
  "python-dateutil>=2.8.2",
  "typing-extensions>=4.7.1",
  "urllib3>=2.1.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=8.0.0",
  "twine>=5.0.0"
]

[project.urls]
Repository = "https://github.com/Tomoarrow-Inc/tomo-idv-client-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
